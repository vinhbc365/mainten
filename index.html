<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><title>Hệ thống đang bảo trì</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#073052;--ocean:#0b6bb8;--aqua:#4cc3e8;--muted:#5a7084;--line:#d7e6f0;--card:#fff;--soft:#f2f8fc;--bg1:#cfeaf8;--bg2:#bfe0f4;--bg:#eef7fc;--ok:#14a36b;--warn:#e8a317;--font:"Be Vietnam Pro",system-ui,"Segoe UI",Roboto,Arial,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#e7f2fb;--ocean:#4aa8e8;--muted:#9bb2c5;--line:#25405a;--card:#0f2338;--soft:#13304a;--bg1:#0d2d4a;--bg2:#0a2238;--bg:#07131f}}
:root[data-theme="dark"]{--navy:#e7f2fb;--ocean:#4aa8e8;--muted:#9bb2c5;--line:#25405a;--card:#0f2338;--soft:#13304a;--bg1:#0d2d4a;--bg2:#0a2238;--bg:#07131f}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font);color:var(--navy);min-height:100vh;display:grid;place-items:start center;
 padding:max(20px,env(safe-area-inset-top,0px)) 16px max(24px,env(safe-area-inset-bottom,0px));
 background:radial-gradient(700px 400px at 15% 0%,var(--bg1),transparent 70%),radial-gradient(600px 400px at 100% 100%,var(--bg2),transparent 70%),var(--bg)}
a:focus-visible,button:focus-visible{outline:3px solid var(--aqua);outline-offset:3px}
.card{position:relative;width:100%;max-width:640px;margin:clamp(0px,3vh,28px) 0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(24px,5vw,44px);text-align:center;box-shadow:0 24px 60px -30px rgba(7,48,82,.45)}
.theme{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--navy);cursor:pointer;font-size:1rem}
.ring{position:relative;width:170px;height:170px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:url(#g);transition:stroke-dashoffset 1s}
.ring div{position:absolute;inset:0;display:grid;place-content:center}
.ring b{font-size:2.3rem;font-weight:800;color:var(--ocean);line-height:1}
.ring span{font-size:.8rem;color:var(--muted);margin-top:4px}
h1{margin-top:22px;font-size:clamp(1.6rem,5vw,2.1rem);font-weight:800;letter-spacing:-.02em;line-height:1.2}
.lead{margin-top:10px;color:var(--muted);line-height:1.6}
.clock{margin:24px 0 8px;display:flex;justify-content:center;align-items:flex-start;gap:clamp(6px,2vw,14px)}
.u{min-width:64px}.n{display:block;font-size:clamp(1.8rem,7vw,2.6rem);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.t{display:block;margin-top:6px;font-size:.78rem;color:var(--muted)}
.sep{font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800;color:var(--aqua);line-height:1}
.eta{font-size:.88rem;color:var(--muted)}
.sec{margin-top:28px;padding-top:24px;border-top:1px solid var(--line);text-align:left}
.sec h2{font-size:1rem;font-weight:600;margin-bottom:14px}
.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.steps li{position:relative;padding-top:18px;font-size:.84rem;line-height:1.35}
.steps li::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;border-radius:99px;background:var(--line)}
.steps .done::before{background:var(--ok)}.steps .doing::before{background:linear-gradient(90deg,var(--warn) 50%,var(--line) 50%)}
.steps b{display:block;font-weight:600}.steps small{color:var(--muted);font-size:.76rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;padding:7px 14px;border-radius:99px;background:var(--soft);border:1px solid var(--line)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--warn)}.chip.ok i{background:var(--ok)}
.b{font:inherit;text-decoration:none;font-weight:600;font-size:.9rem;padding:11px 20px;border-radius:99px;border:1px solid var(--line);color:var(--navy);background:var(--card);cursor:pointer}
.b.p{background:var(--ocean);border-color:var(--ocean);color:#fff}
.btns{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
.f{margin-top:20px;font-size:.78rem;color:var(--muted);text-align:center}
@media(max-width:520px){.steps{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){.ring .fg{transition:none}}
</style></head><body>
<main class="card">
 <button class="theme" id="theme" type="button" aria-label="Đổi giao diện sáng/tối">◐</button>
 <div class="ring" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="pb">
  <svg viewBox="0 0 120 120"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b6bb8"/><stop offset="1" stop-color="#4cc3e8"/></linearGradient></defs>
   <circle class="bg" cx="60" cy="60" r="52" fill="none" stroke-width="9"/>
   <circle class="fg" id="fg" cx="60" cy="60" r="52" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
  <div><b id="pct">0%</b><span>hoàn thành</span></div>
 </div>
 <h1>Hệ thống đang bảo trì</h1>
 <p class="lead">Chúng tôi đang nâng cấp để mang lại trải nghiệm tốt hơn. Vui lòng quay lại sau.</p>
 <div class="clock" role="timer">
  <div class="u"><span class="n" id="d">00</span><span class="t">Ngày</span></div><span class="sep">:</span>
  <div class="u"><span class="n" id="h">00</span><span class="t">Giờ</span></div><span class="sep">:</span>
  <div class="u"><span class="n" id="m">00</span><span class="t">Phút</span></div><span class="sep">:</span>
  <div class="u"><span class="n" id="s">00</span><span class="t">Giây</span></div>
 </div>
 <p class="eta" id="eta"></p>

 <section class="sec"><h2>Tiến trình</h2><ol class="steps" id="steps"></ol></section>
 <section class="sec"><h2>Tình trạng dịch vụ</h2><div class="chips" id="chips"></div></section>

 <section class="sec"><div class="btns"><a class="b" href="tel:+84917231357">Hotline : +84917231357</a></div></section>
</main>
<script>
// ===== CẤU HÌNH =====
var END_TIME="2026-10-10T18:00:00+07:00";
var PROGRESS=25; // TIẾN ĐỘ HIỆN TẠI (0-100): sửa số này mỗi khi xong một giai đoạn
var STEPS=[ // p: mốc phần trăm hoàn thành của giai đoạn
 {t:"Giai đoạn 1",p:25},{t:"Giai đoạn 2",p:50},{t:"Giai đoạn 3",p:75},{t:"Giai đoạn 4",p:100}];
var SERVICES=[ // ok: true | false
 {n:"Dịch vụ A",ok:false},{n:"Dịch vụ B",ok:false},{n:"Dịch vụ C",ok:false},{n:"Dịch vụ D",ok:true}];
// ====================
var $=function(i){return document.getElementById(i)},pad=function(n){return String(n).padStart(2,"0")};
var q=new URLSearchParams(location.search).get("t"),en=new Date(q||END_TIME).getTime(),tm;
$("chips").innerHTML=SERVICES.map(function(x){return '<span class="chip'+(x.ok?' ok':'')+'"><i></i>'+x.n+' · '+(x.ok?'Hoạt động':'Đang bảo trì')+'</span>'}).join("");
$("theme").addEventListener("click",function(){var r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=d?"light":"dark"});
function renderSteps(p){var prev=0;$("steps").innerHTML=STEPS.map(function(x){
 var c=p>=x.p?"done":(p>prev?"doing":"todo");prev=x.p;
 return '<li class="'+c+'"><b>'+x.t+'</b><small>'+x.p+'%'+(c==="done"?' · Hoàn tất':c==="doing"?' · Đang thực hiện':'')+'</small></li>'}).join("")}
function setP(p){p=Math.max(0,Math.min(100,Math.round(p)));$("pct").textContent=p+"%";$("fg").style.strokeDashoffset=326.7*(1-p/100);$("pb").setAttribute("aria-valuenow",p);renderSteps(p)}
function tick(){var L=en-Date.now();if(isNaN(en)){clearInterval(tm);return}
 if(L<=0){["d","h","m","s"].forEach(function(k){$(k).textContent="00"});$("eta").textContent="Đã đến thời gian dự kiến. Đang hoàn tất, trang sẽ tự tải lại.";clearInterval(tm);setTimeout(function(){location.reload()},15000);return}
 var t=Math.floor(L/1e3);$("d").textContent=pad(Math.floor(t/86400));$("h").textContent=pad(Math.floor(t%86400/3600));$("m").textContent=pad(Math.floor(t%3600/60));$("s").textContent=pad(t%60);
 $("eta").textContent="Dự kiến hoàn tất: "+new Date(en).toLocaleString("vi-VN",{dateStyle:"full",timeStyle:"short",timeZone:"Asia/Ho_Chi_Minh"});}
setP(PROGRESS);tick();tm=setInterval(tick,1000);
</script></body></html>
